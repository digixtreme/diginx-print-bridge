name: Build DigiNx Print Bridge MSI

on:
  workflow_dispatch:

concurrency:
  group: diginx-print-bridge-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-msi:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version

      - name: Build self-contained bridge and MSI
        shell: pwsh
        run: ./scripts/build-msi.ps1

      - name: Verify MSI output
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/DigiNx-Print-Bridge-Setup-x64.msi')) { throw 'MSI missing' }
          Get-Content 'dist/SHA256SUMS.txt'

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: DigiNx-Print-Bridge-Setup-x64
          path: |
            dist/DigiNx-Print-Bridge-Setup-x64.msi
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
